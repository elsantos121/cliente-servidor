version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foro
      POSTGRES_PASSWORD: foro_password
      POSTGRES_DB: foro_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foro -d foro_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      # Nota: En producción real se usaría la URL de la BD del contenedor
      DATABASE_URL: "postgresql://foro:foro_password@db:5432/foro_dev?schema=public"
      JWT_SECRET: "un_secreto_muy_largo_y_seguro_para_produccion"
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy