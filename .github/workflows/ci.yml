# Fase 5 · Integración continua.
# Corre en cada push y pull request a develop y main. Regla del equipo: no se integra a main con el CI en rojo.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # Base de pruebas efímera: se crea vacía en cada ejecución y se descarta al terminar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores solo para CI. El nombre de la base termina en _test: el guard de las pruebas lo exige.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foro_test?schema=public
      JWT_SECRET: secreto-de-ci-solo-para-pruebas-no-usar-en-produccion
      JWT_EXPIRES_IN: 2h
      BCRYPT_COSTO: 4
      CORS_ORIGIN: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias y de integración (Vitest + Supertest)
        run: npm test

      - name: Pruebas de aceptación (Cucumber)
        run: npm run test:bdd

      - name: Compilar
        run: npm run build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de componentes y servicios
        run: npx ng test --watch=false

      - name: Compilar
        run: npx ng build
